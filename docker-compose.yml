version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://vortex_user:vortex_secure_pass_2026@postgres:5432/vortex_db?schema=public
      - JWT_SECRET=vortex_super_jwt_secret_key_prod_2026
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://vortex.io
      - NEXT_PUBLIC_SUPPORT_WHATSAPP=+1234567890
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: vortex_user
      POSTGRES_PASSWORD: vortex_secure_pass_2026
      POSTGRES_DB: vortex_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
